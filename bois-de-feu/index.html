<!doctype html>
<html lang="fr-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bois de feu</title>
  <meta name="description" content="Stock de bois de feu (photos), entrées de bois façonné ou acheté, commandes et livraisons. Triage forestier du Vallon.">
  <meta name="theme-color" content="#6b3f1d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo-vallon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/logo-vallon-180.png">
  <meta name="apple-mobile-web-app-title" content="Bois de feu">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <img src="img/logo-triage.jpg" alt="Triage forestier du Vallon" class="top-logo">
      <div class="top-titles"><div class="app-name">Bois de feu</div><div class="view-title" id="view-title">Stock</div></div>
    </header>

    <main id="view"></main>

    <nav class="tabs" aria-label="Menu">
      <button data-view="stock"><span>🪵</span>Stock</button>
      <button data-view="entrees"><span>🪓</span>Entrées</button>
      <button data-view="livraisons"><span>🚚</span>Livraisons<i hidden></i></button>
      <button data-view="plus"><span>☰</span>Plus</button>
    </nav>
  </div>

  <datalist id="dl-entreprises"></datalist>
  <dialog id="dlg" class="dialog"></dialog>
  <dialog id="viewer" class="viewer"><img alt="Photo"></dialog>
  <div id="print"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
